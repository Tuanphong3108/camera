<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#11140e">
<meta name="description" content="Camera - ứng dụng camera chạy ngay trên trình duyệt, giao diện Material 3 Expressive">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-96x96.png">
<link rel="apple-touch-icon" href="web-app-manifest-192x192.png">
<link rel="preload" href="fonts/symbols-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/gsf-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="gif-encoder.js" defer></script>
<script src="scanner.js" defer></script>
<script type="module" src="vendor/mwc.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>

<div id="splash"><img src="icon.png" alt=""></div>

<div id="app" data-mode="photo" data-sub="">

  <!-- ============ Thanh trái: menu 3 chấm + công cụ ============ -->
  <aside id="railL">
    <div class="menu-wrap">
      <md-icon-button id="btnMenu" data-i18n-aria="menu.open"><md-icon data-i="more_vert"></md-icon></md-icon-button>
      <md-menu id="menu" anchor="btnMenu" positioning="popover">
        <md-menu-item id="miFolders"><md-icon slot="start" data-i="folder"></md-icon><div slot="headline" data-i18n="menu.folders"></div></md-menu-item>
        <md-menu-item id="miLang"><md-icon slot="start" data-i="language"></md-icon><div slot="headline" data-i18n="menu.language"></div></md-menu-item>
        <md-menu-item id="miGs"><md-icon slot="start" data-i="help"></md-icon><div slot="headline" data-i18n="menu.getting_started"></div></md-menu-item>
        <md-menu-item id="miAbout"><md-icon slot="start" data-i="info"></md-icon><div slot="headline" data-i18n="menu.about"></div></md-menu-item>
      </md-menu>
    </div>

    <div class="tools">
      <md-icon-button id="btnSwitch" class="tool" hidden data-i18n-aria="tool.switch"><md-icon data-i="cameraswitch"></md-icon></md-icon-button>
      <md-icon-button id="btnFilter" class="tool" data-i18n-aria="tool.filter"><md-icon data-i="filter_vintage"></md-icon></md-icon-button>
      <md-icon-button id="btnMirror" class="tool" data-i18n-aria="tool.mirror"><md-icon data-i="flip"></md-icon></md-icon-button>
      <md-icon-button id="btnGrid" class="tool" data-i18n-aria="tool.grid"><md-icon data-i="grid_off"></md-icon><md-icon slot="selected" data-i="grid_on"></md-icon></md-icon-button>
      <md-icon-button id="btnTimer" class="tool" data-i18n-aria="tool.timer"><md-icon data-i="timer"></md-icon><span id="timerBadge"></span></md-icon-button>
    </div>
  </aside>

  <!-- ============ Khung xem trước ============ -->
  <main id="stage">
    <div id="viewfinder">
      <video id="video" playsinline muted autoplay></video>
      <div id="gridLines"></div>
      <div id="docFrame"></div>
      <canvas id="docCanvas"></canvas>
      <div id="scanBadge"></div>
      <div id="flash"></div>
      <div id="count"></div>
      <div id="recTimer"><span class="rec-dot"></span><span id="recTime">00:00</span></div>
      <div id="toast" role="status" aria-live="polite"></div>

      <div id="qrChip">
        <span id="qrText"></span>
        <md-text-button id="qrCopy" data-i18n="qr.copy"></md-text-button>
        <md-text-button id="qrOpen" data-i18n="qr.open"></md-text-button>
      </div>

      <md-chip-set id="filters" aria-label="Filters">
        <md-filter-chip data-f="none" selected data-i18n-label="filter.none" label="Bình thường"></md-filter-chip>
        <md-filter-chip data-f="sepia" data-i18n-label="filter.sepia" label="Sepia"></md-filter-chip>
        <md-filter-chip data-f="grayscale" data-i18n-label="filter.grayscale" label="Trắng đen"></md-filter-chip>
        <md-filter-chip data-f="vivid" data-i18n-label="filter.vivid" label="Sống động"></md-filter-chip>
        <md-filter-chip data-f="invert" data-i18n-label="filter.invert" label="Đảo màu"></md-filter-chip>
        <md-filter-chip data-f="saturate" data-i18n-label="filter.saturate" label="Bão hòa"></md-filter-chip>
        <md-filter-chip data-f="contrast" data-i18n-label="filter.contrast" label="Tương phản"></md-filter-chip>
        <md-filter-chip data-f="brightness" data-i18n-label="filter.brightness" label="Độ sáng"></md-filter-chip>
      </md-chip-set>

      <div id="subModes">
        <div class="sub" data-for="video" role="tablist">
          <button data-sub="normal" role="tab"><span data-i18n="sub.normal"></span><md-ripple></md-ripple></button>
          <button data-sub="gif" role="tab"><span data-i18n="sub.gif"></span><md-ripple></md-ripple></button>
          <button data-sub="timelapse" role="tab"><span data-i18n="sub.timelapse"></span><md-ripple></md-ripple></button>
        </div>
        <div class="sub" data-for="scan" role="tablist">
          <button data-sub="document" role="tab"><span data-i18n="sub.document"></span><md-ripple></md-ripple></button>
          <button data-sub="qr" role="tab"><span data-i18n="sub.qr"></span><md-ripple></md-ripple></button>
        </div>
      </div>
    </div>
  </main>

  <!-- ============ Thanh phải: micrô + nút chụp ============ -->
  <aside id="railR">
    <md-icon-button id="btnMic" data-i18n-aria="tool.mic"><md-icon data-i="mic"></md-icon><md-icon slot="selected" data-i="mic_off"></md-icon></md-icon-button>
    <button id="shutter" aria-label="Chụp ảnh"><span class="ring"></span><span class="core"></span><md-ripple></md-ripple></button>
  </aside>

  <!-- ============ Thanh dưới: chế độ + nút mở Photos ============ -->
  <footer id="bar">
    <nav id="modes" role="tablist">
      <button class="mode" data-mode="video" role="tab"><span data-i18n="mode.video"></span><md-ripple></md-ripple></button>
      <button class="mode" data-mode="photo" role="tab"><span data-i18n="mode.photo"></span><md-ripple></md-ripple></button>
      <button class="mode" data-mode="scan" role="tab"><span data-i18n="mode.scan"></span><md-ripple></md-ripple></button>
    </nav>
    <button id="thumb" data-i18n-aria="thumb.open"><img id="thumbImg" alt="" hidden><md-icon id="thumbIcon" data-i="photo_library"></md-icon><md-ripple></md-ripple></button>
  </footer>
</div>

<!-- ============ Quét tài liệu: xem lại / chỉnh góc ============ -->
<div id="scanView" hidden>
  <div id="svRail">
    <md-icon-button id="svCancel" data-i18n-aria="scan.cancel"><md-icon data-i="close"></md-icon></md-icon-button>
    <div class="grow"></div>
    <md-icon-button id="svAdd" data-i18n-aria="scan.add"><md-icon data-i="library_add"></md-icon></md-icon-button>
    <md-icon-button id="svEditBtn" data-i18n-aria="scan.edit"><md-icon data-i="crop_free"></md-icon></md-icon-button>
    <md-icon-button id="svDel" data-i18n-aria="scan.delete"><md-icon data-i="delete"></md-icon></md-icon-button>
    <md-icon-button id="svShare" data-i18n-aria="scan.share"><md-icon data-i="share"></md-icon></md-icon-button>
  </div>
  <div id="svThumbs"></div>
  <div id="svStage">
    <img id="svImg" alt="">
    <div id="edBox" hidden>
      <svg id="edSvg"><polygon id="edPoly"></polygon></svg>
      <i class="hd" data-k="0"></i><i class="hd" data-k="1"></i><i class="hd" data-k="2"></i><i class="hd" data-k="3"></i>
    </div>
    <div id="svTitle"></div>
  </div>
  <div id="svActions">
    <md-filled-button id="svPhoto"><md-icon slot="icon" data-i="image"></md-icon><span data-i18n="scan.save_photo"></span></md-filled-button>
    <md-filled-tonal-button id="svPdf"><md-icon slot="icon" data-i="picture_as_pdf"></md-icon><span data-i18n="scan.save_pdf"></span></md-filled-tonal-button>
    <md-text-button id="svEdCancel" data-i18n="scan.edit_cancel"></md-text-button>
    <md-filled-button id="svEdDone" data-i18n="scan.edit_done"></md-filled-button>
  </div>
</div>

<!-- ============ Hộp thoại: thư mục lưu ảnh ============ -->
<md-dialog id="dlgFolders">
  <div slot="headline" data-i18n="folders.title"></div>
  <div slot="content">
    <p class="dlg-text" data-i18n="folders.desc"></p>
    <md-list id="folderList"></md-list>
    <p class="dlg-text" id="folderEmpty" data-i18n="folders.empty"></p>
  </div>
  <div slot="actions">
    <md-text-button id="btnAddFolder"><md-icon slot="icon" data-i="create_new_folder"></md-icon><span data-i18n="folders.add"></span></md-text-button>
    <md-filled-button id="btnFoldersDone" data-i18n="common.done"></md-filled-button>
  </div>
</md-dialog>

<!-- ============ Hộp thoại: chọn thư mục lưu ảnh ============ -->
<md-dialog id="dlgPick">
  <div slot="headline" data-i18n="pick.title"></div>
  <div slot="content">
    <p class="dlg-text" id="pickMsg"></p>
    <md-list id="pickList"></md-list>
  </div>
  <div slot="actions"><md-filled-button id="btnPickOk" data-i18n="pick.ok"></md-filled-button></div>
</md-dialog>

<!-- ============ Hộp thoại: ngôn ngữ ============ -->
<md-dialog id="dlgLang">
  <div slot="headline" data-i18n="lang.title"></div>
  <div slot="content">
    <md-list>
      <md-list-item type="button" data-lang="vi"><md-radio slot="start" name="lang" value="vi" touch-target="wrapper"></md-radio><div slot="headline" data-i18n="lang.vi"></div></md-list-item>
      <md-list-item type="button" data-lang="en"><md-radio slot="start" name="lang" value="en" touch-target="wrapper"></md-radio><div slot="headline" data-i18n="lang.en"></div></md-list-item>
    </md-list>
  </div>
  <div slot="actions"><md-filled-button id="btnLangDone" data-i18n="common.done"></md-filled-button></div>
</md-dialog>

<!-- ============ Hộp thoại: về ứng dụng ============ -->
<md-dialog id="dlgAbout">
  <div slot="headline" data-i18n="about.title"></div>
  <div slot="content">
    <p class="dlg-text" data-i18n="about.desc"></p>
    <div class="about-rows">
      <div><md-icon data-i="verified"></md-icon><span data-i18n="about.version"></span><b>2026.11.15</b></div>
      <div><md-icon data-i="code"></md-icon><span data-i18n="about.developer"></span><b>Phong VN</b></div>
      <div><md-icon data-i="terminal"></md-icon><span data-i18n="about.source"></span><a href="https://github.com/tuanphong3108/camera" target="_blank" rel="noopener noreferrer">GitHub</a></div>
    </div>
  </div>
  <div slot="actions"><md-filled-button id="btnAboutDone" data-i18n="common.close"></md-filled-button></div>
</md-dialog>

<!-- ============ Hướng dẫn bắt đầu (iframe, giống music-player / photos) ============ -->
<div id="gs" hidden><iframe id="gsFrame" title="Getting started"></iframe></div>

</body>
</html>
